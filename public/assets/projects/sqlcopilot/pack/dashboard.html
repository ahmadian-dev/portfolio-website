<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Performance Dashboard — AI SQL Copilot</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg:#F7F8FA; --elev:#fff; --ink:#0F172A; --muted:#475569; --line:#E2E8F0; --accent:#0E7490; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"IBM Plex Sans",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    header { background:#0F172A; color:#F8FAFC; padding:1.75rem 6vw; border-bottom:3px solid var(--accent); }
    header h1 { font-family:"IBM Plex Serif",Georgia,serif; font-size:1.5rem; }
    header p { color:#94A3B8; margin-top:.35rem; }
    .mark { font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:#A7F3D0; margin-bottom:.5rem; }
    main { padding:2rem 6vw 3rem; max-width:1100px; margin:0 auto; }
    .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-bottom:1.5rem; }
    @media(max-width:800px){ .kpis{grid-template-columns:1fr;} }
    .kpi { background:var(--elev); border:1px solid var(--line); padding:1rem 1.15rem; }
    .kpi .l { font-size:.75rem; color:var(--muted); text-transform:uppercase; }
    .kpi .v { font-family:"IBM Plex Mono",monospace; font-size:1.8rem; font-weight:600; color:var(--accent); margin-top:.2rem; }
    .panel { background:var(--elev); border:1px solid var(--line); padding:1.25rem; margin-bottom:1.25rem; box-shadow:0 8px 24px rgba(15,23,42,.06); }
    .note { font-size:.85rem; color:var(--muted); margin-top:.75rem; }
    canvas { max-height:280px; }
  </style>
</head>
<body>
  <header>
    <div class="mark">Portfolio Demo · Released</div>
    <h1>Performance Dashboard</h1>
    <p>AI SQL Copilot · labeled fixtures · safety + execution checks</p>
  </header>
  <main>
    <div class="kpis">
      <div class="kpi"><div class="l">Execution Accuracy</div><div class="v">1.00</div></div>
      <div class="kpi"><div class="l">Syntax Valid Rate</div><div class="v">1.00</div></div>
      <div class="kpi"><div class="l">Safety Block Rate</div><div class="v">1.00</div></div>
    </div>
    <div class="panel">
      <h2>Fixture metrics</h2>
      <canvas id="chart"></canvas>
      <p class="note">Figure 2. Source: reports/metrics/eval_metrics.json — sample demo DB methodology.</p>
    </div>
  </main>
  <script>
    new Chart(document.getElementById("chart"), {
      type: "bar",
      data: {
        labels: ["Execution accuracy", "Syntax valid", "Safety block"],
        datasets: [{ data: [1.0, 1.0, 1.0], backgroundColor: ["#0E7490", "#64748B", "#0F172A"], barThickness: 56 }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: { y: { min: 0, max: 1, grid: { color: "#E2E8F0" } }, x: { grid: { display: false } } }
      }
    });
  </script>
</body>
</html>
